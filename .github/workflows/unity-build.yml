name: Unity Build

# Deliberately manual and tag-triggered rather than on every push. A Unity build
# takes tens of minutes; running one per commit burns the free-tier minutes for
# no benefit while you are still iterating in the editor.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No WebGL. docs/SETUP.md says why, and the technical half of the
        # reason is that WebGL has no UDP - Relay would have to fall back to
        # WebSockets, which is the transport this project deliberately left
        # behind. Building it would produce an artifact that cannot connect.
        targetPlatform:
          - StandaloneWindows64
          - StandaloneLinux64

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      # macOS and iOS need a macos-latest runner, which costs 10x the Linux rate
      # on GitHub-hosted runners. Add that target only once someone asks for it.
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: ${{ matrix.targetPlatform }}

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
