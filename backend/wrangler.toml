# Cloudflare Workers configuration for the game backend.
#
# Before first deploy:
#   1. npx wrangler d1 create gta7-db          -> paste the database_id below
#   2. npx wrangler kv namespace create CONFIG -> paste the id below
#   3. npx wrangler r2 bucket create gta7-builds
#   4. npx wrangler secret put RUN_HMAC_SECRET
#   5. npx wrangler secret put TURNSTILE_SECRET
#   6. npm run db:migrate:remote
#   7. npm run deploy

name = "gta7-api"
main = "src/index.ts"
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]

# api.<your-domain> -> this Worker. Requires the zone to be on Cloudflare.
# Uncomment and set your zone once DNS is ready.
# routes = [
#   { pattern = "api.example.com", custom_domain = true }
# ]

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
# Comma-separated list of origins allowed to call the API from a browser.
# The native game client does not send Origin, so this only gates the web build.
ALLOWED_ORIGINS = "https://example.com,https://www.example.com,https://play.example.com"
# Reject run submissions from clients older than this (semver-ish string compare).
MIN_CLIENT_VERSION = "0.1.0"

[[d1_databases]]
binding = "DB"
database_name = "gta7-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CONFIG"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "BUILDS"
bucket_name = "gta7-builds"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyRoom"]

[env.staging]
name = "gta7-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
ALLOWED_ORIGINS = "http://localhost:8788,https://dev.example.com"
MIN_CLIENT_VERSION = "0.0.1"
